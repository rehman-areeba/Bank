name: Deploy Full Stack to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '18.x'

jobs:
  # Backend Build and Deploy
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build backend
        run: dotnet build ./BankingApi/BankingApi.csproj --configuration Release --no-restore
      
      - name: Run tests
        run: dotnet test ./BankingApi.Tests/BankingApi.Tests.csproj --configuration Release --no-build --verbosity normal
      
      - name: Publish backend
        run: dotnet publish ./BankingApi/BankingApi.csproj --configuration Release --output ./publish
      
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: ./publish
          retention-days: 7
      
      - name: Trigger Render deployment
        run: |
          echo "✅ Backend build successful"
          echo "🚀 Render will auto-deploy from this commit"
          echo "📊 Monitor deployment at: https://dashboard.render.com"

  # Frontend Build and Deploy
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./banking-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: ./banking-ui
        run: npm ci
      
      - name: TypeScript check
        working-directory: ./banking-ui
        run: npx tsc --noEmit
      
      - name: Lint check
        working-directory: ./banking-ui
        run: npm run lint
        continue-on-error: true
      
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      
      - name: Pull Vercel environment
        working-directory: ./banking-ui
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Build with Vercel
        working-directory: ./banking-ui
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Deploy to Vercel
        working-directory: ./banking-ui
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "✅ Frontend deployed successfully"
          echo "🌐 Deployment URL: $DEPLOYMENT_URL"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV
      
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: ./banking-ui/.vercel/output
          retention-days: 7

  # Deployment Summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# 🚀 Full Stack Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Platform |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | ${{ needs.deploy-backend.result }} | Render |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend UI | ${{ needs.deploy-frontend.result }} | Vercel |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Verify backend health: Check Render dashboard" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Verify frontend: Check Vercel dashboard" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Test API connectivity from frontend" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Monitor logs for any errors" >> $GITHUB_STEP_SUMMARY
