name: Pull Request Validation

# Trigger only on pull requests
on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  # Job 1: PR Metadata Check
  pr-metadata:
    name: PR Metadata Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Check PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          # Check if PR title follows conventional commits
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: ]]; then
            echo "⚠️ PR title should follow conventional commits format"
            echo "Examples: feat: add new feature, fix: resolve bug, docs: update readme"
          fi
      
      - name: Check PR description
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if [ -z "$PR_BODY" ]; then
            echo "⚠️ PR description is empty. Please provide a description."
          else
            echo "✅ PR has a description"
          fi

  # Job 2: Changed Files Analysis
  changed-files:
    name: Analyze Changed Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get changed files
        id: changed-files
        run: |
          echo "## 📝 Changed Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get list of changed files
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          
          # Count changes by type
          BACKEND_CHANGES=$(grep -c "^BankingApi/" changed_files.txt || echo "0")
          FRONTEND_CHANGES=$(grep -c "^banking-ui/" changed_files.txt || echo "0")
          TEST_CHANGES=$(grep -c "^BankingApi.Tests/" changed_files.txt || echo "0")
          
          echo "| Component | Files Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | $BACKEND_CHANGES |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend UI | $FRONTEND_CHANGES |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | $TEST_CHANGES |" >> $GITHUB_STEP_SUMMARY
          
          # Check if tests were added for backend changes
          if [ "$BACKEND_CHANGES" -gt "0" ] && [ "$TEST_CHANGES" -eq "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning:** Backend changes detected but no test changes found." >> $GITHUB_STEP_SUMMARY
          fi

  # Job 3: Code Size Check
  code-size:
    name: Code Size Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check code additions
        run: |
          # Get diff stats
          ADDITIONS=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oP '\d+(?= insertion)' || echo "0")
          DELETIONS=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oP '\d+(?= deletion)' || echo "0")
          
          echo "## 📊 Code Changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Additions:** +$ADDITIONS lines" >> $GITHUB_STEP_SUMMARY
          echo "- **Deletions:** -$DELETIONS lines" >> $GITHUB_STEP_SUMMARY
          echo "- **Net Change:** $((ADDITIONS - DELETIONS)) lines" >> $GITHUB_STEP_SUMMARY
          
          # Warn if PR is too large
          if [ "$ADDITIONS" -gt "500" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Large PR:** Consider breaking this into smaller PRs for easier review." >> $GITHUB_STEP_SUMMARY
          fi

  # Job 4: Run Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore and test
        run: |
          dotnet restore
          dotnet test ./BankingApi.Tests/BankingApi.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"
      
      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "TestResults/test-results.trx" ]; then
            echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed or not found" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 5: Run Frontend Build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: ./banking-ui/package-lock.json
      
      - name: Install and build
        working-directory: ./banking-ui
        run: |
          npm ci
          npm run build
      
      - name: Build Summary
        run: |
          echo "## 🏗️ Frontend Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "banking-ui/dist" ]; then
            echo "✅ Build successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Build size:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            du -sh banking-ui/dist >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 6: PR Summary
  pr-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [pr-metadata, changed-files, code-size, backend-tests, frontend-build]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## ✅ PR Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PR Metadata | ${{ needs.pr-metadata.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Changed Files | ${{ needs.changed-files.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Size | ${{ needs.code-size.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Check if all passed
          if [ "${{ needs.backend-tests.result }}" == "success" ] && [ "${{ needs.frontend-build.result }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **All checks passed! PR is ready for review.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Some checks failed. Please fix the issues before merging.**" >> $GITHUB_STEP_SUMMARY
          fi
