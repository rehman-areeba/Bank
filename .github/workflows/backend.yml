name: Backend CI/CD Pipeline

# Trigger the workflow on push to main branch or pull requests targeting main
on:
  push:
    branches: [ main ]
    paths:
      - 'BankingApi/**'
      - 'BankingApi.Tests/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BankingApi/**'
      - 'BankingApi.Tests/**'
      - '.github/workflows/backend.yml'

# Define environment variables used across all jobs
env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  API_PROJECT_PATH: './BankingApi/BankingApi.csproj'
  TEST_PROJECT_PATH: './BankingApi.Tests/BankingApi.Tests.csproj'

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better analysis
      
      # Step 2: Setup .NET 10 SDK
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      # Step 3: Display .NET version for verification
      - name: Display .NET version
        run: dotnet --version
      
      # Step 4: Restore NuGet packages for all projects
      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./
      
      # Step 5: Build the API project in Release mode
      - name: Build API project
        run: dotnet build ${{ env.API_PROJECT_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
      # Step 6: Build the Test project
      - name: Build Test project
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
      # Step 7: Run unit tests with code coverage
      - name: Run unit tests
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
      
      # Step 8: Upload test results as artifacts
      - name: Upload test results
        if: always()  # Run even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: 30
      
      # Step 9: Upload code coverage results
      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 30
      
      # Step 10: Publish the API (creates deployment-ready artifacts)
      - name: Publish API
        run: |
          dotnet publish ${{ env.API_PROJECT_PATH }} \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --output ./publish
      
      # Step 11: Upload published artifacts for deployment
      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: banking-api-artifacts
          path: ./publish
          retention-days: 7

  # Job 2: Code Quality Analysis (runs in parallel with build-and-test)
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore
      
      # Step 4: Run code format check
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true  # Don't fail the build, just warn
      
      # Step 5: Run security vulnerability scan
      - name: Security vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee security-scan.log
          if grep -q "has the following vulnerable packages" security-scan.log; then
            echo "⚠️ Vulnerable packages detected!"
            exit 1
          fi
      
      # Step 6: Upload security scan results
      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan
          path: security-scan.log
          retention-days: 30

  # Job 3: Database Migration Check (optional, runs after build succeeds)
  migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    needs: build-and-test  # Only run if build-and-test succeeds
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      # Step 3: Install EF Core tools
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef
      
      # Step 4: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore
      
      # Step 5: Check for pending migrations
      - name: Check migrations
        run: |
          cd BankingApi
          dotnet ef migrations list --no-build || echo "No migrations found or EF Core not configured"
        continue-on-error: true

  # Job 4: Build Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: always()  # Always run to show summary
    
    steps:
      - name: Build Summary
        run: |
          echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build and Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
